<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Custom cup ordering – 定制杯子">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <title>Cup Custom Order — 定制杯子</title>
  <link rel="stylesheet" href="css/style.css">

  <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header" id="app-header">
      <!-- Rendered by JS -->
    </header>

    <!-- Screen 1: Cup Selection -->
    <div class="screen active" id="screen-select-cup">
      <!-- Rendered by JS -->
    </div>

    <!-- Screen 2: Text Customization -->
    <div class="screen" id="screen-customize">
      <!-- Rendered by JS -->
    </div>

    <!-- Screen 3: Payment -->
    <div class="screen" id="screen-payment">
      <!-- Rendered by JS -->
    </div>

    <!-- Screen 4: Order Success -->
    <div class="screen" id="screen-success">
      <!-- Rendered by JS -->
    </div>
  </div>

  <!-- QR Code Modal -->
  <div class="qr-modal" id="qr-modal">
    <div class="qr-modal-content">
      <!-- Rendered by JS -->
    </div>
  </div>

  <!-- Admin Overlay -->
  <div class="admin-overlay" id="admin-overlay"></div>

  <!-- Admin Panel -->
  <div class="admin-panel" id="admin-panel">
    <div class="admin-header">
      <h2 data-i18n="adminTitle">Admin Panel</h2>
      <button class="admin-close">&times;</button>
    </div>
    <div class="admin-body" id="admin-body">
      <!-- Rendered by JS -->
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div class="confirm-dialog" id="confirm-dialog">
    <div class="confirm-dialog-content">
      <!-- Rendered by JS -->
    </div>
  </div>

  <!-- Three.js for 3D cup preview -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
